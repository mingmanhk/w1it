<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1128"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="wstroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A81F7"/>
      <stop offset="1" stop-color="#6FA6FF"/>
    </linearGradient>
    <radialGradient id="glowg" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#00A878" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00A878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowb" cx="0.1" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#3A81F7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3A81F7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowg)"/>
  <rect width="1200" height="630" fill="url(#glowb)"/>

  <!-- decorative network mesh -->
  <g stroke="#3A81F7" stroke-opacity="0.12" stroke-width="2">
    <line x1="920" y1="90" x2="1050" y2="180"/>
    <line x1="1050" y1="180" x2="980" y2="320"/>
    <line x1="980" y1="320" x2="1130" y2="400"/>
    <line x1="1050" y1="180" x2="1160" y2="120"/>
    <line x1="80" y1="500" x2="200" y2="560"/>
    <line x1="200" y1="560" x2="310" y2="500"/>
  </g>
  <g fill="#3A81F7" opacity="0.25">
    <circle cx="920" cy="90" r="6"/>
    <circle cx="1050" cy="180" r="8"/>
    <circle cx="980" cy="320" r="6"/>
    <circle cx="1130" cy="400" r="6"/>
    <circle cx="1160" cy="120" r="5"/>
    <circle cx="80" cy="500" r="6"/>
    <circle cx="200" cy="560" r="8"/>
    <circle cx="310" cy="500" r="6"/>
  </g>

  <!-- mark -->
  <g transform="translate(120,215) scale(0.39)">
    <rect width="512" height="512" rx="116" fill="#0C1533" stroke="#3A81F7" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M128 178 L192 336 L256 226 L320 336 L384 178"
          fill="none" stroke="url(#wstroke)" stroke-width="46"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="128" cy="178" r="27" fill="#FFFFFF"/>
    <circle cx="192" cy="336" r="22" fill="#FFFFFF"/>
    <circle cx="256" cy="226" r="22" fill="#FFFFFF"/>
    <circle cx="320" cy="336" r="22" fill="#FFFFFF"/>
    <circle cx="384" cy="178" r="34" fill="#00A878"/>
    <circle cx="384" cy="178" r="14" fill="#FFFFFF"/>
  </g>

  <!-- wordmark -->
  <text x="370" y="308" font-family="DejaVu Sans, Arial, sans-serif" font-size="88" font-weight="bold" fill="#FFFFFF">W1IT Solutions</text>
  <rect x="374" y="340" width="120" height="8" rx="4" fill="#00A878"/>
  <text x="372" y="404" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#D9D9D9">Managed IT · Cybersecurity · Cloud Solutions</text>
  <text x="372" y="456" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#7C8AA5">Seattle, WA · w1it.com</text>
</svg>
