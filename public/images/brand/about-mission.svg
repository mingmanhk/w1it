<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF3F9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#panel)"/>

  <!-- ascending steps -->
  <g>
    <rect x="120" y="420" width="120" height="80" rx="12" fill="#3A81F7" opacity="0.25"/>
    <rect x="260" y="360" width="120" height="140" rx="12" fill="#3A81F7" opacity="0.45"/>
    <rect x="400" y="300" width="120" height="200" rx="12" fill="#3A81F7" opacity="0.7"/>
    <rect x="540" y="240" width="120" height="260" rx="12" fill="#3A81F7"/>
  </g>

  <!-- flag on top -->
  <g transform="translate(600,240)">
    <line x1="0" y1="0" x2="0" y2="-110" stroke="#050816" stroke-width="8" stroke-linecap="round"/>
    <path d="M4 -106 L84 -84 L4 -62 Z" fill="#00A878"/>
  </g>

  <!-- target -->
  <g transform="translate(220,220)">
    <circle r="96" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    <circle r="64" fill="none" stroke="#3A81F7" stroke-width="12"/>
    <circle r="34" fill="none" stroke="#3A81F7" stroke-width="12" opacity="0.6"/>
    <circle r="12" fill="#00A878"/>
    <!-- arrow -->
    <g stroke="#050816" stroke-width="8" stroke-linecap="round">
      <line x1="10" y1="-10" x2="86" y2="-86"/>
    </g>
    <path d="M62 -96 L96 -96 L96 -62 Z" fill="#050816" transform="rotate(0)"/>
  </g>

  <!-- dotted trajectory -->
  <path d="M240 240 C 360 140 520 140 600 128" fill="none" stroke="#00A878" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round"/>

  <g fill="#00A878" opacity="0.5">
    <circle cx="110" cy="120" r="8"/>
    <circle cx="700" cy="500" r="8"/>
    <circle cx="690" cy="120" r="6"/>
  </g>
</svg>
