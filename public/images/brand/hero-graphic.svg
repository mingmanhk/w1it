<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF3F9"/>
    </linearGradient>
    <linearGradient id="cloudg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A81F7"/>
      <stop offset="1" stop-color="#2C67D6"/>
    </linearGradient>
    <linearGradient id="srv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1533"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1536" rx="48" fill="url(#panel)"/>

  <!-- orbit rings -->
  <g fill="none" stroke="#3A81F7" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="10 14">
    <circle cx="512" cy="640" r="380"/>
    <circle cx="512" cy="640" r="290"/>
  </g>

  <!-- cloud -->
  <g transform="translate(512,430)">
    <path d="M-170 60 a70 70 0 0 1 12-139 a95 95 0 0 1 183-30 a80 80 0 0 1 128 64 a62 62 0 0 1 -14 105 z"
          fill="url(#cloudg)"/>
    <circle cx="118" cy="-88" r="26" fill="#00A878"/>
    <circle cx="118" cy="-88" r="10" fill="#FFFFFF"/>
    <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
      <line x1="-52" y1="-6" x2="-52" y2="26"/>
      <line x1="0" y1="-26" x2="0" y2="26"/>
      <line x1="52" y1="-6" x2="52" y2="26"/>
    </g>
  </g>

  <!-- connections cloud -> nodes -->
  <g stroke="#3A81F7" stroke-opacity="0.45" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round">
    <line x1="512" y1="520" x2="512" y2="700"/>
    <line x1="400" y1="480" x2="230" y2="640"/>
    <line x1="624" y1="480" x2="794" y2="640"/>
  </g>

  <!-- left node: shield -->
  <g transform="translate(230,700)">
    <circle r="86" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    <path d="M0 -46 L38 -30 V6 C38 34 20 52 0 60 C-20 52 -38 34 -38 6 V-30 Z" fill="#00A878"/>
    <path d="M-14 4 L-4 16 L18 -12" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- right node: gear -->
  <g transform="translate(794,700)">
    <circle r="86" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    <g fill="#3A81F7">
      <circle r="40"/>
      <g>
        <rect x="-9" y="-62" width="18" height="24" rx="6"/>
        <rect x="-9" y="38" width="18" height="24" rx="6"/>
        <rect x="38" y="-9" width="24" height="18" rx="6"/>
        <rect x="-62" y="-9" width="24" height="18" rx="6"/>
        <rect x="24" y="-52" width="18" height="24" rx="6" transform="rotate(45)"/>
        <rect x="24" y="28" width="18" height="24" rx="6" transform="rotate(-45)"/>
        <rect x="-42" y="-52" width="18" height="24" rx="6" transform="rotate(-45)"/>
        <rect x="-42" y="28" width="18" height="24" rx="6" transform="rotate(45)"/>
      </g>
    </g>
    <circle r="16" fill="#FFFFFF"/>
  </g>

  <!-- center node: server stack -->
  <g transform="translate(512,780)">
    <g>
      <rect x="-130" y="-60" width="260" height="64" rx="14" fill="url(#srv)"/>
      <rect x="-130" y="16" width="260" height="64" rx="14" fill="url(#srv)"/>
      <rect x="-130" y="92" width="260" height="64" rx="14" fill="url(#srv)"/>
      <g fill="#00A878">
        <circle cx="-100" cy="-28" r="8"/>
        <circle cx="-100" cy="48" r="8"/>
        <circle cx="-100" cy="124" r="8"/>
      </g>
      <g fill="#3A81F7" opacity="0.9">
        <rect x="-64" y="-34" width="120" height="12" rx="6"/>
        <rect x="-64" y="42" width="150" height="12" rx="6"/>
        <rect x="-64" y="118" width="90" height="12" rx="6"/>
      </g>
    </g>
  </g>

  <!-- uptime chart card -->
  <g transform="translate(512,1180)">
    <rect x="-330" y="-120" width="660" height="260" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    <text x="-294" y="-64" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#050816">Uptime &amp; Monitoring</text>
    <g>
      <rect x="-294" y="60" width="52" height="48" rx="8" fill="#3A81F7" opacity="0.35"/>
      <rect x="-214" y="28" width="52" height="80" rx="8" fill="#3A81F7" opacity="0.55"/>
      <rect x="-134" y="44" width="52" height="64" rx="8" fill="#3A81F7" opacity="0.45"/>
      <rect x="-54" y="0" width="52" height="108" rx="8" fill="#3A81F7"/>
      <rect x="26" y="16" width="52" height="92" rx="8" fill="#3A81F7" opacity="0.7"/>
      <rect x="106" y="-24" width="52" height="132" rx="8" fill="#00A878"/>
      <rect x="186" y="-8" width="52" height="116" rx="8" fill="#00A878" opacity="0.7"/>
    </g>
    <g transform="translate(232,-70)">
      <circle r="30" fill="#00A878" opacity="0.15"/>
      <text x="0" y="9" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#00A878">99.9</text>
    </g>
  </g>

  <!-- floating accent dots -->
  <g fill="#00A878" opacity="0.5">
    <circle cx="140" cy="300" r="10"/>
    <circle cx="900" cy="260" r="8"/>
    <circle cx="120" cy="1050" r="8"/>
    <circle cx="912" cy="1060" r="10"/>
  </g>
</svg>
